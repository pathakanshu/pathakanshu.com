<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>pathakanshu.com</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                font-family:
                    system-ui,
                    -apple-system,
                    sans-serif;
                background: #0a0a0a;
                color: #e0e0e0;
            }

            h1 {
                font-size: 2rem;
                margin-bottom: 0.5rem;
            }

            p {
                font-size: 1.1rem;
                color: #888;
                margin-bottom: 1.5rem;
            }

            a {
                color: #a78bfa;
                text-decoration: none;
                font-size: 1.1rem;
                border: 1px solid #a78bfa;
                padding: 0.6rem 1.4rem;
                border-radius: 8px;
                transition:
                    background 0.2s,
                    color 0.2s;
            }

            a:hover {
                background: #a78bfa;
                color: #0a0a0a;
            }
        </style>
    </head>
    <body>
        <h1>Anshu Pathak</h1>
        <p>Portfolio coming soon 🚧</p>
        <a
            href="https://linktr.ee/pathakanshu"
            target="_blank"
            rel="noopener noreferrer"
            >Linktree ↗</a
        >
    </body>
</html>
